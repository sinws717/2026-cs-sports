<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 청석고 8회 한마음 가족체육대회</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981', // Emerald green representing nature/sports and subtle agricultural bank feel
                        primaryDark: '#059669',
                        nonghyup: '#006633',
                        nonghyupLight: '#e6f4ed'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            min-height: 100vh;
        }
        /* Toast animation */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col items-center justify-start py-6 px-4 sm:px-6">

    <!-- Mobile Container -->
    <div class="w-full max-w-md bg-white shadow-2xl rounded-3xl overflow-hidden border border-slate-100 flex flex-col relative transition-all duration-300">
        
        <!-- In-App Browser Warning Banner (Hidden by default, shown if in-app detected) -->
        <div id="inAppNotice" class="bg-amber-500 text-white px-4 py-3 text-xs flex items-center justify-between shadow-inner hidden">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-triangle-exclamation text-sm"></i>
                <span id="inAppText">외부 브라우저로 여시면 더 원활합니다.</span>
            </div>
            <button onclick="openInExternalBrowser()" class="bg-white text-amber-700 font-bold px-2.5 py-1 rounded shadow text-[11px] active:scale-95 transition-all whitespace-nowrap">
                외부 브라우저로 열기
            </button>
        </div>

        <!-- Header Banner -->
        <div class="bg-gradient-to-r from-nonghyup to-emerald-700 text-white p-6 text-center relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-32 h-32 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
            <div class="absolute -left-10 -bottom-10 w-32 h-32 bg-emerald-400/20 rounded-full blur-xl pointer-events-none"></div>
            
            <span class="inline-block bg-white/20 text-emerald-100 text-xs font-semibold px-3 py-1 rounded-full mb-2 tracking-wide uppercase">
                2026년 제8회 동창회
            </span>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight mb-1">한마음 가족체육대회</h1>
            <p class="text-emerald-100 text-sm font-medium">청석고등학교 8회 동창회 공식 안내</p>
        </div>

        <!-- Main Body Content -->
        <div class="p-6 space-y-6 bg-slate-50/50 flex-1">

            <!-- Event Info Card -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
                <div class="flex items-center space-x-3 pb-3 border-b border-slate-100">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-nonghyup flex items-center justify-center text-lg font-bold">
                        <i class="fa-solid fa-calendar-days"></i>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 font-medium block">행사 일시</span>
                        <span class="text-slate-800 font-bold text-base">2026년 11월 7일(토) 10:00</span>
                    </div>
                </div>

                <div class="flex items-center space-x-3 pb-3 border-b border-slate-100">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-nonghyup flex items-center justify-center text-lg font-bold">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 font-medium block">행사 장소</span>
                        <span class="text-slate-800 font-bold text-base">청주 한솔초등학교(강당)</span>
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-nonghyup flex items-center justify-center text-lg font-bold">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 font-medium block">참가 대상</span>
                        <span class="text-slate-800 font-bold text-base">8회 친구 모두 (가족 동반 가능)</span>
                    </div>
                </div>
            </div>

            <!-- Account Information Card -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-wallet text-nonghyup"></i>
                        <h2 class="font-bold text-slate-800 text-base">참가비 및 찬조금 입금계좌</h2>
                    </div>
                    <span class="text-xs bg-emerald-50 text-nonghyup font-semibold px-2.5 py-1 rounded-md">8회 전용</span>
                </div>

                <!-- Bank Box -->
                <div class="bg-emerald-50/70 border border-emerald-100 rounded-xl p-4 flex flex-col space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold text-emerald-800 bg-emerald-200/60 px-2 py-0.5 rounded">NH농협</span>
                        <span class="text-xs text-slate-500 font-medium">8회 동창 전용계좌</span>
                    </div>

                    <!-- Account Number & Copy Button -->
                    <div class="flex items-center justify-between bg-white px-3.5 py-2.5 rounded-lg border border-emerald-200 shadow-sm">
                        <span id="accountNumber" class="font-mono font-bold text-slate-800 text-base sm:text-lg tracking-wide">351-1387-9451-03</span>
                        <button onclick="copyAccount()" 
                            class="bg-nonghyup hover:bg-nonghyupLight hover:text-nonghyup text-white text-xs font-semibold px-3.5 py-2 rounded-md transition-all flex items-center space-x-1.5 shadow-sm active:scale-95">
                            <i class="fa-regular fa-copy"></i>
                            <span>복사</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Organizer Contact Card -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 font-bold text-lg">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 font-medium block">회장 문의</span>
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-slate-800 text-base">신우성 회장</span>
                            <span class="text-xs text-slate-500">010-3478-1774</span>
                        </div>
                    </div>
                </div>
                <a href="tel:010-3478-1774" 
                   class="bg-emerald-50 text-nonghyup hover:bg-nonghyup hover:text-white w-11 h-11 rounded-full flex items-center justify-center transition-all shadow-sm active:scale-95"
                   title="전화걸기">
                    <i class="fa-solid fa-phone text-base"></i>
                </a>
            </div>

        </div>

        <!-- Footer -->
        <div class="bg-white py-4 px-6 text-center border-t border-slate-100 text-xs text-slate-400 font-medium">
            청석고등학교 제8회 동창회 · 모든 권리 보유
        </div>

    </div>

    <!-- Toast Notification Popup -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 text-sm font-medium z-50 hidden transition-all">
        <div class="w-6 h-6 rounded-full bg-emerald-500 flex items-center justify-center text-white text-xs">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastMessage">계좌번호가 복사되었습니다!</span>
    </div>

    <!-- JavaScript for Clipboard Copy & Notification -->
    <script>
        function copyAccount() {
            const rawAccountText = document.getElementById('accountNumber').innerText;
            // 하이픈(-)을 제거하여 숫자만 추출 ("3511387945103")
            const accountText = rawAccountText.replace(/-/g, '');
            
            // Clipboard copy implementation using fallback or execCommand for iframe safety
            const textArea = document.createElement("textarea");
            textArea.value = accountText;
            textArea.style.position = "fixed";  // Avoid scrolling to bottom
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('계좌번호가 클립보드에 복사되었습니다!');
                } else {
                    showToast('복사에 실패했습니다. 직접 복사해주세요.', true);
                }
            } catch (err) {
                console.error('Fallback copy error:', err);
                showToast('복사 기능을 사용할 수 없습니다.', true);
            }

            document.body.removeChild(textArea);
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.innerText = message;
            
            if(isError) {
                toast.classList.remove('bg-slate-900/95');
                toast.classList.add('bg-red-600');
            } else {
                toast.classList.remove('bg-red-600');
                toast.classList.add('bg-slate-900/95');
            }

            toast.classList.remove('hidden');
            toast.classList.add('animate-slide-up');

            // Hide after 2.5 seconds
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('animate-slide-up');
            }, 2500);
        }

        // In-App Browser Detection & External Browser Redirector
        function checkInAppBrowser() {
            const userAgent = navigator.userAgent.toLowerCase();
            const isKakao = userAgent.includes('kakaotalk');
            const isNaver = userAgent.includes('naver');
            const isFacebook = userAgent.includes('fbav') || userAgent.includes('fbios');
            const isInstagram = userAgent.includes('instagram');
            const isLine = userAgent.includes('line');
            const isTwitter = userAgent.includes('twitter');

            if (isKakao || isNaver || isFacebook || isInstagram || isLine || isTwitter) {
                const notice = document.getElementById('inAppNotice');
                notice.classList.remove('hidden');
            }
        }

        function openInExternalBrowser() {
            const currentUrl = window.location.href;
            const userAgent = navigator.userAgent.toLowerCase();

            if (userAgent.includes('android')) {
                // Android Intent URL to force open in Chrome or default browser
                // scheme: https -> intent://...#Intent;scheme=https;package=com.android.chrome;end;
                const cleanUrl = currentUrl.replace(/^https?:\/\//, '');
                const intentUrl = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end;`;
                window.location.href = intentUrl;
            } else if (/iphone|ipad|ipod/.test(userAgent)) {
                // iOS: Safari can't be forced directly via intent, show alert guidance to use menu
                showToast('우측 상단 메뉴(⋯ 또는 공유)에서 "다른 브라우저로 열기"를 선택해주세요.', false);
            } else {
                // Fallback for desktop or other environments
                window.open(currentUrl, '_system');
            }
        }

        // Run detection on load
        window.onload = function() {
            checkInAppBrowser();
        };
    </script>
</body>
</html>
